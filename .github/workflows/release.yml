name: Release

# Publishes the npm package that installs these skills (`npx @libra-tools/skills`).
#
# Trigger: push a version tag that matches package.json, e.g.
#   libra tag v0.1.0 && libra push origin v0.1.0
#
# Requires the repository secret NPM_TOKEN (an npm automation token). Provenance
# needs `id-token: write` and a public repository.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and inspect only; do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Package must exist
        run: |
          if [ ! -f package.json ]; then
            echo "No package.json yet — the npm installer has not landed."
            echo "See the 'Publishing' section of AGENTS.md."
            exit 1
          fi

      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      # Never ship an invalid or drifted skill to the registry.
      - name: Validate skills
        run: bash scripts/validate-skills.sh

      - name: Agent mirrors are in sync with skills/
        run: bash scripts/sync-skills.sh --check

      # The tarball must carry skills/ (canonical) and NOT the generated mirrors.
      - name: Inspect the tarball
        run: |
          npm pack --dry-run
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const files = require("/tmp/pack.json")[0].files.map(f => f.path);
            const bad = files.filter(f => /^\.(agents|claude|codex)\//.test(f));
            if (bad.length) { console.error("generated mirrors leaked into the tarball:", bad); process.exit(1); }
            if (!files.some(f => f.startsWith("skills/"))) { console.error("tarball carries no skills/"); process.exit(1); }
            console.log(`tarball ok: ${files.length} files`);
          '

      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

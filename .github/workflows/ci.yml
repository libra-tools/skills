name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Libra ships breaking changes several times a week. The drift job below has
  # to run on a clock, not only when this repository changes.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  skills:
    name: Validate skills, mirrors and installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The same two checks the local pre-commit hook runs. A local hook can be
      # skipped with --no-verify; this one cannot.
      - name: Validate skills
        run: bash scripts/validate-skills.sh

      - name: Agent mirrors are in sync with skills/
        run: bash scripts/sync-skills.sh --check

      # Regression guard: these scripts are documented as `./install.sh` and
      # `scripts/sync-skills.sh`, which fails outright without the exec bit.
      - name: Scripts are executable
        run: |
          status=0
          for f in install.sh scripts/*.sh hooks/*.sh; do
            [ -x "$f" ] || { echo "not executable: $f"; status=1; }
          done
          exit $status

      - name: Shell scripts parse
        run: |
          status=0
          for f in install.sh scripts/*.sh hooks/*.sh; do
            bash -n "$f" || status=1
          done
          exit $status

      - name: install.sh --dry-run
        run: ./install.sh --dry-run

      - name: install.sh round trip
        run: |
          ./install.sh --copy
          test -f "$HOME/.claude/skills/libra-workflow-and-versioning/SKILL.md"
          test -f "$HOME/.agents/skills/libra-workflow-and-versioning/references/worktrees.md"
          test -f "$HOME/.config/libra/skills/libra-workflow-and-versioning.md"
          ./install.sh --uninstall
          test ! -e "$HOME/.claude/skills/libra-workflow-and-versioning"
          test ! -e "$HOME/.config/libra/skills/libra-workflow-and-versioning.md"

      - name: install.sh --no-libra skips the bridge
        run: |
          ./install.sh --copy --no-libra
          test ! -e "$HOME/.config/libra/skills/libra-workflow-and-versioning.md"
          ./install.sh --uninstall

      # `libra code` parses TOML frontmatter with serde deny_unknown_fields, so an
      # extra or misspelled key makes the emitted skill unloadable.
      - name: libra-native emitter output is loadable
        run: |
          for skill in skills/*/; do
            name="$(basename "$skill")"
            bash scripts/emit-libra-skill.sh --stdout "$name" > "/tmp/$name.md"
          done
          python3 - /tmp/*.md <<'PY'
          import sys, re, tomllib
          for path in sys.argv[1:]:
              text = open(path, encoding="utf-8").read()
              assert text.startswith("---"), f"{path}: missing leading fence"
              data = tomllib.loads(text[3:text.index("---", 3)].strip())
              extra = set(data) - {"name", "description", "version", "allowed-tools", "allowed_tools"}
              assert not extra, f"{path}: keys libra would reject: {sorted(extra)}"
              assert data.get("name"), f"{path}: name must be non-empty"
              body = text[text.index("---", 3) + 3:]
              dangling = re.findall(r"\]\(references/", body)
              assert not dangling, f"{path}: {len(dangling)} reference links survive flattening"
              print(f"{path}: ok ({sorted(data)})")
          PY

  drift:
    name: Claims still match Libra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Only what the cross-check reads: the command docs, the error-code table
      # and the version. Cloning the whole Libra tree for three inputs is waste.
      - name: Check out the Libra docs
        uses: actions/checkout@v7
        with:
          repository: libra-tools/libra
          path: libra-src
          sparse-checkout: |
            docs/commands
            docs/error-codes.md
            Cargo.toml
          sparse-checkout-cone-mode: false

      - name: Cross-check every claim a machine can check
        env:
          LIBRA_SRC: ${{ github.workspace }}/libra-src
        run: bash scripts/check-against-libra.sh --verbose
